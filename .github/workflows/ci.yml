name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bunx --package vite-plus@0.2.9 vp install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Migration runner tests
        run: bun test tests/scripts/db-migrate.test.ts

      - name: PDF ingest tests
        run: bun run pdf:test

      - name: MCP tests
        run: bun run mcp:test

      - name: CLI tests
        run: bun run cli:test

      - name: CLI build
        run: bun run --cwd apps/cli build

      - name: Build
        run: bun run build
