name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Check release intent
        if: github.head_ref != 'changeset-release/main'
        run: bun run changeset:status

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Migration runner tests
        run: bun test tests/scripts/db-migrate.test.ts

      - name: Build
        run: bun run build
