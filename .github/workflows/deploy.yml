name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "bun.lock"
      - "package.json"
      - "apps/web/**"
      - "apps/mcp-server/**"
      - "db/migrations/**"
      - "packages/shared/**"
      - "scripts/db-migrate.ts"

# Keep migration and deployment as one ordered production operation. Without
# this, overlapping main pushes can publish an older commit after a newer one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate-db:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bunx --package vite-plus@0.2.9 vp install --frozen-lockfile

      - name: Apply database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-web:
    needs: migrate-db
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bunx --package vite-plus@0.2.9 vp install --frozen-lockfile

      - name: Build
        run: bun run build:prod
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: https://api.ooxml.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=ooxml-dev

  deploy-mcp:
    needs: migrate-db
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bunx --package vite-plus@0.2.9 vp install --frozen-lockfile

      - name: Deploy MCP Server
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mcp-server
          # This subdirectory has no Bun lockfile, so automatic detection falls back to npm.
          packageManager: bun
